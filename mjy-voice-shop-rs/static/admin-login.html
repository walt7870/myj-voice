<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>管理员登录</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=20260730-admin-data" />
  </head>
  <body class="admin-page auth-page">
    <div class="auth-atmosphere" aria-hidden="true"><i></i><i></i></div>
    <main class="auth-card">
      <header class="auth-intro">
        <div class="brand-mark">管</div>
        <div><span class="auth-kicker">管理中心</span><h1>欢迎回来</h1></div>
      </header>
      <p class="auth-description">登录后管理设备授权与沟通记录</p>
      <form id="loginForm">
        <label for="username"><span>管理员账号</span><input id="username" name="username" value="myjadmin" autocomplete="username" required /></label>
        <label for="password"><span>登录密码</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required /></label>
        <button id="loginButton" type="submit"><span>进入管理后台</span></button>
        <p id="loginMessage" class="form-message" role="status"></p>
      </form>
      <p class="auth-security-note"><span aria-hidden="true">●</span> 请仅在受信任的设备上登录</p>
    </main>
    <script>
      const markers = ["/myj-voice-shop", "/mjy-voice-shop"];
      const base = markers.find((marker) => location.pathname === marker || location.pathname.startsWith(`${marker}/`)) || "";
      const nextValue = new URLSearchParams(location.search).get("next") || `${base}/admin.html`;
      const safeNext = nextValue.startsWith(`${base}/admin`) && !nextValue.includes("://") ? nextValue : `${base}/admin.html`;
      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("loginButton");
        const password = document.getElementById("password");
        const message = document.getElementById("loginMessage");
        button.disabled = true;
        message.textContent = "正在登录…";
        try {
          const response = await fetch(`${base}/api/admin/auth/login`, {
            method: "POST",
            credentials: "same-origin",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ username: document.getElementById("username").value.trim(), password: password.value }),
          });
          if (response.ok) return location.replace(safeNext);
          message.textContent = response.status === 429 ? "尝试次数过多，请稍后再试" : "账号或密码错误";
          password.value = "";
          password.focus();
        } catch {
          message.textContent = "网络异常，请稍后重试";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
